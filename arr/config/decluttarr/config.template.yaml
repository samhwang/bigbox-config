general:
  log_level: INFO
  test_run: true
  timer: 10
  # request_timeout: 15 # Optional: timeout for all HTTP/API calls in seconds
  # ignored_download_clients: ["emulerr"]
  ssl_verification: true
  request_timeout: 15
  # private_tracker_handling: "obsolete_tag" # remove, skip, obsolete_tag. Optional. Default: remove
  # public_tracker_handling: "remove"  # remove, skip, obsolete_tag. Optional. Default: remove
  # obsolete_tag: "Obsolete" # optional. Default: "Obsolete"
  # protected_tag: "Keep" # optional. Default: "Keep"

job_defaults:
  max_strikes: 3
  min_days_between_searches: 7
  max_concurrent_searches: 3

jobs:
  remove_bad_files:
    # keep_archives: true
  remove_done_seeding:
    # target_tags:
    #   - "Obsolete"
    # target_categories:
    #  - "autobrr"
  remove_failed_downloads:
  remove_failed_imports:
    message_patterns:
      - "Not a Custom Format upgrade for existing*"
      - "Not an upgrade for existing*"
      - "*Found potentially dangerous file with extension*"
      - "Invalid video file*"
      - "No files found are eligible for import*"
      - "One or more episodes expected in this release were not imported or missing from the release"
  remove_metadata_missing:
    # max_strikes: 3
  remove_missing_files:
  remove_orphans:
  remove_slow:
    # min_speed: 100
    # max_strikes: 3
  remove_stalled:
    # max_strikes: 3
  remove_unmonitored:
  search_unmet_cutoff:
    # min_days_between_searches: 7
    # max_concurrent_searches: 3
  search_missing:
    # min_days_between_searches: 7
    # max_concurrent_searches: 3

instances:
  sonarr:
    - base_url: "http://sonarr:8989"
      api_key: "{{ op://Private/BigBox - Sonarr/API Key }}"
  radarr:
    - base_url: "http://radarr:7878"
      api_key: "{{ op://Private/BigBox - Radarr/API Key }}"

download_clients:
  qbittorrent:
    - base_url: "http://gluetun:8081"
      api_key: "{{ op://Private/BigBox - QBittorrent/API Key }}"
      name: "qBittorrent" # (Must correspond with what is specified in your *arr as download client name)
